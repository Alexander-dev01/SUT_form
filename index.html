<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Director</title>
  <link rel="stylesheet" href="./style/reset.css">
  <link rel="stylesheet" href="./style/variables.css">
  <link rel="stylesheet" href="./style/style.css">

</head>

<body>
  <div class="container">
    <nav class="header">
      <a href="https://sutvdonsk.ru/" class="logo">
        <img src="./images/logo.png" alt="">
      </a>
      <div class="header-text">Муниципальное бюджетное учреждение
        дополнительного образования
        «СТАНЦИЯ ЮНЫХ ТЕХНИКОВ»
      </div>
    </nav>
    <h1>Заявка на участие в конференции </h1>
    <form>
      <div class="title"><h2>Выбор секции</h2></div>
      <label>Секция
        <select name="sekcia" data-js-sekcia required>
          <option selected>Программирование на пк</option>
          <option>Web-программирование</option>
          <option>Физико-математические науки</option>
          <option>Инженерно-техническая выставка</option>
          <option>Робототехника</option>
          <option>Атомная наука и техника</option>
          <option>Эрудит</option>
          <option>Мир вокруг нас</option>
          <option>Начальное техническое моделирование</option>
          <option>Радиоконструирование</option>
          <option>Набор и верстка текста</option>
          <option>Современные компьютерные технологии</option>
          <option>География</option>
        </select>
      </label>
      <label>Подсекция
        <select name="podsekcia" data-js-podsekcia>
          <option selected>Scratch</option>
          <option>Другие языки программирования</option>
        </select>
      </label>
      
      <div class="title"><h2>Данные ученика</h2></div>
      <label>Фамилия
        <input type="text" name="familia" required value="Иванов">
      </label>
      <label>Имя
        <input type="text" name="imya" required value="Иван">
      </label>
      <label>Отчество
        <input type="text" name="otcestvo" required value="Иванович">
      </label>
      <label>Номер телефона
        <input type="tel" name="tel" required maxlength="11" value="89041231221" pattern="[0-9]{11}"
          title="Введите 11 цифр, например: 89041231221" inputmode="numeric">
      </label>
      <label>Электронная почта
        <input type="email" name="email" value="obrazec@mail.ru" required>
      </label>
      <!-- <label>Год рождения
        <input type="date" name="dataSpawn" required>
      </label> -->
      <label>Образовательное учреждение
        <select name="schule" required>
          <option selected>Школа №1</option>
          <option>Школа №2</option>
          <option>Школа №3</option>
        </select>
      </label>
      <label>Класс
        <input type="number" name="klass" required min="1" max="11" step="1" title="Введите класс от 1 до 11" value="1">
      </label>
      <!-- <label>Доп. образование (не обязатаельно)
        <input type="text" name="dop">
      </label> -->

      <div class="title"><h2>Данные работы ученика</h2></div>
      <label data-js-nazwanie>Название работы
        <input type="text" name="rabota" required value="Разработка сайта велопроката">
      </label>
      <label data-js-kolwo >Количество баллов на отборочном этапе
        <input type="number" disabled="true" name="balls" value="99" required>
      </label>
      <label data-js-foto >Ссылка на фото работы
        <input type="url" disabled="true" name="foto" value="https://sutvdonsk.ru/images/sliders/1494940542.jpg" required>
      </label>


      <div class="title"><h2>Данные руководителя</h2></div>
      <label>Фамилия руководителя
        <input type="text" name="familiaR" required value="Иванов">
      </label>
      <label>Имя руководителя
        <input type="text" name="imyaR" required value="Иван">
      </label>
      <label>Отчество руководителя
        <input type="text" name="otcestvoR" required value="Иванович">
      </label>
      <!-- <label>Номер телефона руководителя
        <input type="tel" name="telR" required maxlength="11" value="89041231221" pattern="[0-9]{11}"
          title="Введите 11 цифр, например: 89041231221" inputmode="numeric">
      </label> -->
    
    
      <div class="title"><h2>Данные сопровождающего</h2></div>
      <label>Фамилия руководителя
        <input type="text" name="familiaS" required value="Иванов">
      </label>
      <label>Имя руководителя
        <input type="text" name="imyaS" required value="Иван">
      </label>
      <label>Отчество руководителя
        <input type="text" name="otcestvoS" required value="Иванович">
      </label>


      <label class="itog invisible"></label>
      <button type="submit">Отправить данные</button>
    </form>
  </div>

  <script src="./js/logik.js"></script>
</body>

</html>
